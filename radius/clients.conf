client localhost {
	ipaddr = 127.0.0.1
	proto = *
	secret = testing123
	require_message_authenticator = yes
	nas_type = other
	limit {
		max_connections = 16
		lifetime = 0
		idle_timeout = 30
	}
}

client docker_network {
	ipaddr = 0.0.0.0/0
	proto = *
	secret = testing123
	require_message_authenticator = yes
	nas_type = other
	limit {
		max_connections = 128
		lifetime = 0
		idle_timeout = 30
	}
}
